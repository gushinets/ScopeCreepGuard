name: Setup frontend
description: Install the pinned Node.js and pnpm toolchain used by the frontend checks.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.34.1
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
