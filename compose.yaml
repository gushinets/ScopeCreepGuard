  env_file: deploy/compose/interpolation.env
- path: deploy/compose/backend.yaml
  project_directory: .
  env_file: deploy/compose/interpolation.env
- path: deploy/compose/app.yaml
  project_directory: .
  env_file: deploy/compose/interpolation.env
- path: deploy/compose/llm-worker.yaml
  project_directory: .
  env_file: deploy/compose/interpolation.env
- path: deploy/compose/export-worker.yaml
  project_directory: .
  env_file: deploy/compose/interpolation.env
- path: deploy/compose/mailpit.yaml
  project_directory: .
  env_file: deploy/compose/interpolation.env
