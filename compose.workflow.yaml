# Explicit approved v2 rollout overlay. Never run this against user data during tests.
services:
  backend:
    environment:
      SCOPE_GUARD_DATABASE_URL: ${SCOPE_GUARD_DATABASE_URL:?Explicit shared API/worker database URL required}
      SCOPE_GUARD_WORKFLOW_V2: "true"
      SCOPE_GUARD_MIGRATION_TARGET: 0004_workflow_retire
      SCOPE_GUARD_EXPORT_BUCKET: ${SCOPE_GUARD_EXPORT_BUCKET:?Private export bucket required}
      SCOPE_GUARD_EXPORT_ENDPOINT: ${SCOPE_GUARD_EXPORT_ENDPOINT:-}
      SCOPE_GUARD_EXPORT_REGION: ${SCOPE_GUARD_EXPORT_REGION:-us-east-1}
      SCOPE_GUARD_EXPORT_ACCESS_KEY: ${SCOPE_GUARD_EXPORT_ACCESS_KEY:-}
      SCOPE_GUARD_EXPORT_SECRET_KEY: ${SCOPE_GUARD_EXPORT_SECRET_KEY:-}
  app:
    environment:
      SCOPE_GUARD_WORKFLOW_V2: "true"
  export-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: export-worker
    init: true
    restart: unless-stopped
    environment:
      SCOPE_GUARD_DATABASE_URL: ${SCOPE_GUARD_DATABASE_URL:?Explicit worker database URL required}
      SCOPE_GUARD_EXPORT_BUCKET: ${SCOPE_GUARD_EXPORT_BUCKET:?Private export bucket required}
      SCOPE_GUARD_EXPORT_ENDPOINT: ${SCOPE_GUARD_EXPORT_ENDPOINT:-}
      SCOPE_GUARD_EXPORT_REGION: ${SCOPE_GUARD_EXPORT_REGION:-us-east-1}
      SCOPE_GUARD_EXPORT_ACCESS_KEY: ${SCOPE_GUARD_EXPORT_ACCESS_KEY:-}
      SCOPE_GUARD_EXPORT_SECRET_KEY: ${SCOPE_GUARD_EXPORT_SECRET_KEY:-}
    depends_on:
      backend: {condition: service_healthy}
