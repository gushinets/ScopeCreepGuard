# Explicit composition; include interpolation inherits the selected root environment.
include:
- path: docker/compose/postgres.yaml
  project_directory: .
  env_file: docker/compose/interpolation.env
- path: docker/compose/migrate.yaml
  project_directory: .
  env_file: docker/compose/interpolation.env
- path: docker/compose/backend.yaml
  project_directory: .
  env_file: docker/compose/interpolation.env
- path: docker/compose/app.yaml
  project_directory: .
  env_file: docker/compose/interpolation.env
- path: docker/compose/llm-worker.yaml
  project_directory: .
  env_file: docker/compose/interpolation.env
- path: docker/compose/export-worker.yaml
  project_directory: .
  env_file: docker/compose/interpolation.env
