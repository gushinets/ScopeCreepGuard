# Common service definitions. Entry-point files own ports and environment values.
services:
  postgres:
    image: postgres:17-alpine
    volumes:
      - scope_creep_guard_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./frontend
      target: runner
    environment:
      SCOPE_GUARD_API_ORIGIN: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 24h
