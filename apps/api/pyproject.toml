[project]
name = "scope-guard-api"
version = "0.1.0"
description = "Scope Creep Guard HTTP composition root"
requires-python = ">=3.12,<3.13"
dependencies = [
  "scope-guard",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.36,<1",
]

[tool.uv.sources]
scope-guard = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scope_guard_api"]
