# Apply the compatible migration first; activate together with compose.workflow.yaml.
# This overlay is never used with application databases during verification.
services:
  backend:
    environment:
      SCOPE_GUARD_LLM_WORKFLOW: "true"
      SCOPE_GUARD_MIGRATION_TARGET: 0005_llm_workflow
      SCOPE_GUARD_OPENAI_MODEL: ${SCOPE_GUARD_OPENAI_MODEL:?Explicit provider model required}
      SCOPE_GUARD_LLM_INPUT_RATE_BOUND: ${SCOPE_GUARD_LLM_INPUT_RATE_BOUND:?Conservative USD per input token bound required}
      SCOPE_GUARD_LLM_OUTPUT_RATE_BOUND: ${SCOPE_GUARD_LLM_OUTPUT_RATE_BOUND:?Conservative USD per output token bound required}
      SCOPE_GUARD_LLM_MAX_COST: ${SCOPE_GUARD_LLM_MAX_COST:-1.00}
  llm-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: export-worker
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - {path: .env, required: false}
      - {path: .env.local, required: false}
      - {path: backend/.env, required: false}
    environment:
      SCOPE_GUARD_DATABASE_URL: ${SCOPE_GUARD_DATABASE_URL:?Explicit shared API/worker database URL required}
      SCOPE_GUARD_WORKFLOW_V2: "true"
      SCOPE_GUARD_LLM_WORKFLOW: "true"
      SCOPE_GUARD_WORKER_ROLE: llm
      SCOPE_GUARD_OPENAI_MODEL: ${SCOPE_GUARD_OPENAI_MODEL:?Explicit provider model required}
      SCOPE_GUARD_LLM_INPUT_RATE_BOUND: ${SCOPE_GUARD_LLM_INPUT_RATE_BOUND:?Conservative input rate required}
      SCOPE_GUARD_LLM_OUTPUT_RATE_BOUND: ${SCOPE_GUARD_LLM_OUTPUT_RATE_BOUND:?Conservative output rate required}
      SCOPE_GUARD_LLM_MAX_COST: ${SCOPE_GUARD_LLM_MAX_COST:-1.00}
    depends_on:
      backend: {condition: service_healthy}
