name: Application checks

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches: [main, "codex/any-758-email-verification-password-reset"]

permissions:
  contents: read

jobs:
  rebase:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PR head synchronization with its base
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ci/scripts/require-rebase.sh "$PR_BASE_REF" "$PR_HEAD_SHA"

  frontend:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-disposable-auth-secret-at-least-32-characters
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: ./ci/actions/setup-frontend
      - uses: ./ci/actions/setup-backend
      - name: Frontend, gateway, type, and build checks
        run: ci/scripts/check-frontend.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./ci/actions/setup-frontend
      - uses: ./ci/actions/setup-backend
      # The Python auth compatibility test invokes the frozen frontend jose and
      # bcryptjs fixture script; this is not frontend migration tooling.
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Backend integration, static analysis, contract, and PDF checks
        run: ci/scripts/check-backend.sh

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./ci/actions/setup-backend
      - name: Compose configuration and image-level runtime checks
        run: ci/scripts/check-containers.sh
      - name: Full disposable Compose stack smoke test
        if: github.head_ref != 'codex/any-782-password-recovery' && github.ref != 'refs/heads/codex/any-782-password-recovery'
        run: ci/scripts/smoke-compose.sh
      # ANY-782 deliberately excludes llm-worker from its verification contour.
      - name: Password recovery Compose journey without llm-worker
        if: github.head_ref == 'codex/any-782-password-recovery' || github.ref == 'refs/heads/codex/any-782-password-recovery'
        run: ci/scripts/smoke-password-recovery.sh

  compose-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./ci/actions/setup-backend
      - name: Install and verify the minimum supported Compose
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.docker/cli-plugins"
          curl --fail --location --silent --show-error https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64 -o "$RUNNER_TEMP/docker-compose-linux-x86_64"
          echo "43fb39c0bc24ac796123935032eddcfb57a7acd9216badeb10714c986ea1e090  $RUNNER_TEMP/docker-compose-linux-x86_64" | sha256sum --check
          install -m 0755 "$RUNNER_TEMP/docker-compose-linux-x86_64" "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - name: Validate exact component, full-stack and deployment configurations
        run: |
          uv sync --locked --all-packages --all-groups --python 3.12
          uv run --no-sync python -m unittest discover -s ci/tests -v
          uv run python backend/scripts/verify_docker_startup.py --config-only
