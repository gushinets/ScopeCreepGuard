name: Application checks
on:
  push:
    branches: [main, codex/any-637-application-boundaries, codex/any-639-data-contracts-and-alembic, codex/any-640-fastapi-business-workflows, codex/any-642-alembic-handover, codex/any-641-python-services]
  pull_request:
    branches: [main, codex/any-638-frontend-backend-foundation, codex/any-639-data-contracts-and-alembic, codex/any-640-fastapi-business-workflows, codex/any-642-alembic-handover]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      AUTH_SECRET: ci-disposable-auth-secret-at-least-32-characters
      NEXT_TELEMETRY_DISABLED: "1"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages --all-groups --python 3.12
        working-directory: backend
      - name: Frontend tests including owned PostgreSQL and compatibility fixtures
        run: node ../scripts/verify-any640.mjs --suite frontend
      - run: node --test scripts/docker-entrypoint.test.mjs
      - run: pnpm lint
      - run: pnpm api:types:check
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Authentication and projects through production Next.js and FastAPI
        run: node ../scripts/verify-any640.mjs --suite auth-gateway
      - name: Generation and Python draft saving through production gateways
        run: node ../scripts/verify-any640.mjs --suite generation-gateway
      - name: Draft persistence through production gateways
        run: node ../scripts/verify-any640.mjs --suite drafts-gateway
      - run: pnpm exec tsc --noEmit

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # The Python auth compatibility test invokes the frozen frontend jose and
      # bcryptjs fixture script; this is not frontend migration tooling.
      - run: pnpm --dir ../frontend install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages --all-groups --python 3.12
      - run: uv run pytest --require-integration
      - run: uv run ruff check . ../apps/api
      - run: uv run ruff format --check . ../apps/api
      - run: uv run mypy src/scope_guard ../apps/api/src/scope_guard_api
      - run: uv run mypy --platform win32 src/scope_guard ../apps/api/src/scope_guard_api
      - run: uv run python scripts/export_openapi.py --check ../contracts/openapi.json
      - name: Render document export fixtures
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          uv run python scripts/verify_any641_pdf.py

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker-compose.dokploy.yml config --no-interpolate --no-env-resolution --quiet
      - run: docker build -f apps/api/Dockerfile -t scope-guard-backend:ci .
      - run: docker build --target runner -t scope-guard-frontend:ci frontend
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
      - run: uv sync --locked --all-packages --all-groups --python 3.12
        working-directory: backend
      - name: Verify document and scope services in images
        run: uv run python scripts/verify_any641_runtime.py --containers --backend-image scope-guard-backend:ci --frontend-image scope-guard-frontend:ci
        working-directory: backend
      - name: Verify backend liveness without PostgreSQL
        run: |
          docker run --entrypoint uvicorn -d --name scope-guard-backend-ci -p 8000:8000 scope-guard-backend:ci scope_guard_api.main:app --host 0.0.0.0 --port 8000
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health/live > /tmp/health.json; then
              python -c 'import json; assert json.load(open("/tmp/health.json")) == {"status": "ok"}'
              exit 0
            fi
            sleep 1
          done
          echo "Backend liveness did not respond after $attempt attempts"
          docker logs scope-guard-backend-ci
          exit 1
      - if: always()
        run: docker rm -f scope-guard-backend-ci || true
