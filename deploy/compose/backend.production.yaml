services:
  backend:
    depends_on:
      silo-init:
        condition: service_completed_successfully
    env_file: !reset []
    ports: !reset []
    environment:
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      SCOPE_GUARD_DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SCOPE_GUARD_PRODUCTION: "true"
      SCOPE_GUARD_ALLOWED_ORIGINS: ${SCOPE_GUARD_ALLOWED_ORIGINS:?Public origin JSON allowlist required}
    expose: ["8000"]
    restart: unless-stopped
