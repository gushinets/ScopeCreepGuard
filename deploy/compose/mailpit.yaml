# Local capture only. No relay, forwarding, credentials or host SMTP port.
services:
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '500'
      MP_MAX_AGE: 7d
    volumes:
    - scope_creep_guard_mailpit:/data
    ports:
    - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
volumes:
  scope_creep_guard_mailpit: {}
