# Local capture only. No relay, forwarding, credentials or host SMTP port.
services:
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '500'
      MP_MAX_AGE: 7d
    volumes:
    - scope_creep_guard_mailpit:/data
    ports:
    - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
volumes:
  scope_creep_guard_mailpit: {}
