# Authoritative service definition; included with repository project_directory.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scope_creep_guard}
      POSTGRES_USER: ${POSTGRES_USER:-scopeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scopeguard_dev_password}
    ports:
    - ${POSTGRES_PORT:-5432}:5432
    volumes:
    - scope_creep_guard_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  scope_creep_guard_postgres:
    name: ${SCOPE_GUARD_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME}_scope_creep_guard_postgres}
    external: ${SCOPE_GUARD_POSTGRES_VOLUME_EXTERNAL:-false}
