# Standalone production entry point for Dokploy.
# Supply POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, DATABASE_URL,
# AUTH_SECRET and OPENAI_API_KEY through Dokploy configuration.
services:
  postgres:
    extends: {file: compose.services.yaml, service: postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: unless-stopped

  migrate:
    extends: {file: compose.services.yaml, service: migrate}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

  app:
    extends: {file: compose.services.yaml, service: app}
    build:
      args:
        DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NODE_USE_ENV_PROXY: ${NODE_USE_ENV_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    expose: ["3000"]
    restart: unless-stopped
    labels:
      - "traefik.http.middlewares.scopecreep-no-h3.headers.customresponseheaders.Alt-Svc="

  backend:
    extends: {file: compose.services.yaml, service: backend}
    environment:
      SCOPE_GUARD_LOG_LEVEL: ${SCOPE_GUARD_LOG_LEVEL:-INFO}
    expose: ["8000"]
    restart: unless-stopped

volumes:
  scope_creep_guard_postgres:
