[project]
name = "scope-guard-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "apps/api"]

[tool.uv.sources]
scope-guard = { workspace = true }
scope-guard-api = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
