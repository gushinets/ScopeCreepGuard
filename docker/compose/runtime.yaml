# Shared server settings, resolved only for application components.
services:
  runtime:
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      SCOPE_GUARD_DATABASE_URL: ${SCOPE_GUARD_DATABASE_URL:-postgres://scopeguard:scopeguard_dev_password@postgres:5432/scope_creep_guard}
      SCOPE_GUARD_PRODUCTION: ${SCOPE_GUARD_PRODUCTION:-false}
      SCOPE_GUARD_LOG_LEVEL: ${SCOPE_GUARD_LOG_LEVEL:-INFO}
      SCOPE_GUARD_WORKFLOW_V2: "true"
      SCOPE_GUARD_LLM_WORKFLOW: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY required; use a synthetic key only for isolated no-job checks}
      SCOPE_GUARD_OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY required}
      SCOPE_GUARD_OPENAI_MODEL: ${SCOPE_GUARD_OPENAI_MODEL:?Explicit provider model required}
      SCOPE_GUARD_LLM_INPUT_RATE_BOUND: ${SCOPE_GUARD_LLM_INPUT_RATE_BOUND:?Input USD per token bound required}
      SCOPE_GUARD_LLM_OUTPUT_RATE_BOUND: ${SCOPE_GUARD_LLM_OUTPUT_RATE_BOUND:?Output USD per token bound required}
      SCOPE_GUARD_LLM_MAX_COST: ${SCOPE_GUARD_LLM_MAX_COST:-1.00}
      SCOPE_GUARD_EXPORT_BUCKET: ${SCOPE_GUARD_EXPORT_BUCKET:?Private export bucket required}
      SCOPE_GUARD_EXPORT_ENDPOINT: ${SCOPE_GUARD_EXPORT_ENDPOINT:-}
      SCOPE_GUARD_EXPORT_REGION: ${SCOPE_GUARD_EXPORT_REGION:-us-east-1}
      SCOPE_GUARD_EXPORT_ACCESS_KEY: ${SCOPE_GUARD_EXPORT_ACCESS_KEY:-}
      SCOPE_GUARD_EXPORT_SECRET_KEY: ${SCOPE_GUARD_EXPORT_SECRET_KEY:-}
      SCOPE_GUARD_ALLOWED_ORIGINS: ${SCOPE_GUARD_ALLOWED_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
