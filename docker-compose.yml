x-database-url: &database-url postgres://scopeguard:scopeguard_dev_password@postgres:5432/scope_creep_guard

services:
  postgres:
    image: postgres:17-alpine
    container_name: scope-creep-guard-postgres
    environment:
      POSTGRES_DB: scope_creep_guard
      POSTGRES_USER: scopeguard
      POSTGRES_PASSWORD: scopeguard_dev_password
    ports:
      - "5432:5432"
    volumes:
      - scope_creep_guard_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopeguard -d scope_creep_guard"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    container_name: scope-creep-guard-migrate
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    profiles: ["app"]
    container_name: scope-creep-guard-app
    build:
      context: .
      target: runner
      args:
        DATABASE_URL: *database-url
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: *database-url
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  scope_creep_guard_postgres:
