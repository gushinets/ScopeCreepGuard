[project]
name = "scope-guard"
version = "0.1.0"
description = "Scope Creep Guard FastAPI foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "bcrypt>=4.3,<6",
  "fastapi>=0.115,<1",
  "langcodes>=3.5,<4",
  "openai>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "uvicorn>=0.36,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scope_guard"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires an owned disposable PostgreSQL container"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
