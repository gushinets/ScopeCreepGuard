[project]
name = "scope-guard"
version = "0.1.0"
description = "Scope Creep Guard FastAPI foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.40,<2",
  "alembic>=1.16,<2",
  "babel>=2.17,<3",
  "bcrypt>=4.3,<6",
  "langcodes>=3.5,<4",
  "openai==2.43.0",
  "psycopg[binary]>=3.2,<4",
  "pydantic==2.13.4",
  "pydantic-settings>=2.6,<3",
  "pypdf>=6,<7",
  "reportlab>=4.4,<5",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "litellm==1.89.3",
  "pydantic-ai-slim==2.2.0",
  "lingua-language-detector==2.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scope_guard"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.40,<2",
    "fonttools>=4.59,<5",
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "types-reportlab>=5.0.0.20261008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../apps/api/src"]
markers = ["integration: requires an owned disposable PostgreSQL container"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
